name: ci
on:
  push: { branches: [ main, "claude/**" ] }
  pull_request:
permissions: { contents: read }
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ./coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage }
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/Rosterix.Web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: src/Rosterix.Web/package-lock.json }
      - run: npm ci
      - run: npx jest
      - run: npx ng build --configuration production
  e2e:
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    defaults: { run: { working-directory: src/Rosterix.Web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: src/Rosterix.Web/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: src/Rosterix.Web/test-results }
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  images:
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.api -t rosterix-api:ci .
      - run: docker build -f deploy/Dockerfile.web -t rosterix-web:ci .
