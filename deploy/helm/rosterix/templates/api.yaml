apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "rosterix.labels" . | nindent 4 }}
data:
  ASPNETCORE_ENVIRONMENT: {{ .Values.environment | quote }}
  AzureAd__TenantId: {{ .Values.azureAd.tenantId | quote }}
  AzureAd__ClientId: {{ .Values.azureAd.clientId | quote }}
  Cors__Origins__0: "https://{{ .Values.host }}"
  Ai__LlmNarration: {{ .Values.llmNarration | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "rosterix.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.api }}
  selector: { matchLabels: { app: {{ .Release.Name }}-api } }
  template:
    metadata: { labels: { app: {{ .Release.Name }}-api } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1654, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          ports: [ { containerPort: 8080, name: http } ]
          envFrom: [ { configMapRef: { name: {{ .Release.Name }}-config } } ]
          env:
            - name: ConnectionStrings__Rosterix
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: sql-connection-string } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ "ALL" ] } }
          volumeMounts: [ { name: tmp, mountPath: /tmp }, { name: logs, mountPath: /app/logs } ]
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: {{- toYaml .Values.resources.api | nindent 12 }}
      volumes: [ { name: tmp, emptyDir: {} }, { name: logs, emptyDir: {} } ]
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-api }
spec: { selector: { app: {{ .Release.Name }}-api }, ports: [ { port: 8080, targetPort: http, name: http } ] }
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: {{ .Release.Name }}-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ .Release.Name }}-api }
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics: [ { type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.cpu }} } } } ]
{{- end }}
