# Plain-manifest deployment (AKS). Secrets are NOT in this file: create `rosterix-secrets` from Key Vault / Akeyless
# (e.g. External Secrets Operator) with keys: sql-connection-string. See DECISIONS.md D-14.
apiVersion: v1
kind: Namespace
metadata: { name: rosterix, labels: { pod-security.kubernetes.io/enforce: restricted } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: rosterix-config, namespace: rosterix }
data:
  ASPNETCORE_ENVIRONMENT: "Staging"
  AzureAd__TenantId: "REPLACE_WITH_TENANT_ID"
  AzureAd__ClientId: "REPLACE_WITH_API_CLIENT_ID"
  Cors__Origins__0: "https://rosterix.example.com"
  Ai__LlmNarration: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rosterix-api, namespace: rosterix, labels: { app: rosterix-api } }
spec:
  replicas: 2
  selector: { matchLabels: { app: rosterix-api } }
  template:
    metadata: { labels: { app: rosterix-api } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1654, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: ghcr.io/example/rosterix-api:latest
          ports: [ { containerPort: 8080, name: http } ]
          envFrom: [ { configMapRef: { name: rosterix-config } } ]
          env:
            - name: ConnectionStrings__Rosterix
              valueFrom: { secretKeyRef: { name: rosterix-secrets, key: sql-connection-string } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ "ALL" ] } }
          volumeMounts: [ { name: tmp, mountPath: /tmp }, { name: logs, mountPath: /app/logs } ]
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: "1", memory: 768Mi } }
      volumes: [ { name: tmp, emptyDir: {} }, { name: logs, emptyDir: {} } ]
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: rosterix }
spec: { selector: { app: rosterix-api }, ports: [ { port: 8080, targetPort: http, name: http } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rosterix-web, namespace: rosterix, labels: { app: rosterix-web } }
spec:
  replicas: 2
  selector: { matchLabels: { app: rosterix-web } }
  template:
    metadata: { labels: { app: rosterix-web } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: ghcr.io/example/rosterix-web:latest
          ports: [ { containerPort: 8080, name: http } ]
          env: [ { name: API_UPSTREAM, value: "http://api:8080" } ]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ "ALL" ] } }
          volumeMounts: [ { name: tmp, mountPath: /tmp }, { name: conf, mountPath: /etc/nginx/conf.d } ]
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 300m, memory: 192Mi } }
      volumes: [ { name: tmp, emptyDir: {} }, { name: conf, emptyDir: {} } ]
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: rosterix }
spec: { selector: { app: rosterix-web }, ports: [ { port: 80, targetPort: http, name: http } ] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rosterix
  namespace: rosterix
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"                       # SEC-05: HTTP → HTTPS
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"            # SEC-05: TLS 1.2+ only
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
spec:
  ingressClassName: nginx
  tls: [ { hosts: [ rosterix.example.com ], secretName: rosterix-tls } ]
  rules:
    - host: rosterix.example.com
      http: { paths: [ { path: /, pathType: Prefix, backend: { service: { name: web, port: { name: http } } } } ] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: rosterix-api, namespace: rosterix }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: rosterix-api }
  minReplicas: 2
  maxReplicas: 6
  metrics: [ { type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } } ]
